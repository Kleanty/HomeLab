# HomeLab Panel APK'sını GitHub'da derler. Actions > build-apk > Run workflow.
# Kalıcı imza için repo Settings > Secrets'a şunları ekle: HOMELAB_KEYSTORE_BASE64, HOMELAB_STORE_PASSWORD,
# HOMELAB_KEY_ALIAS, HOMELAB_KEY_PASSWORD. Aynı anahtarla imzalanan APK, telefondaki uygulamanın üstüne güncelleme olarak kurulur.
# Anahtar yoksa APK debug anahtarıyla imzalanır: "-debug" adıyla Artifact olarak yüklenir, sürüme EKLENMEZ.
name: build-apk

on:
  workflow_dispatch:
  push:
    paths: ["android-panel/**", ".github/workflows/build-apk.yml"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Sürüm bilgisi
        run: |
          set -euo pipefail
          VER="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' agent/HomeLab.Agent/HomeLab.Agent.csproj | head -n 1)"
          APK_VER="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android-panel/app/build.gradle.kts | head -n 1)"
          case "$APK_VER" in "$VER"*) ;; *) echo "APK sürümü ($APK_VER) ajan sürümüyle ($VER) uyuşmuyor"; exit 1;; esac
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: İmza anahtarı
        env:
          KEYSTORE: ${{ secrets.HOMELAB_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "HOMELAB_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "SIGNED=release" >> "$GITHUB_ENV"
          else
            echo "SIGNED=debug" >> "$GITHUB_ENV"
            echo "::warning::İmza anahtarı yok: APK debug anahtarıyla imzalanacak ve sürüme eklenmeyecek."
          fi

      - name: Birim testleri
        working-directory: android-panel
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest --no-daemon --console=plain

      - name: APK derle
        working-directory: android-panel
        env:
          HOMELAB_STORE_PASSWORD: ${{ secrets.HOMELAB_STORE_PASSWORD }}
          HOMELAB_KEY_ALIAS: ${{ secrets.HOMELAB_KEY_ALIAS }}
          HOMELAB_KEY_PASSWORD: ${{ secrets.HOMELAB_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - name: Lint raporu (bilgi amaçlı, derlemeyi durdurmaz)
        continue-on-error: true
        working-directory: android-panel
        run: ./gradlew lintRelease --no-daemon --console=plain

      - name: APK'yı adlandır ve özetle
        run: |
          set -euo pipefail
          mkdir -p dist
          SRC="$(ls android-panel/app/build/outputs/apk/release/*.apk | head -n 1)"
          if [ "$SIGNED" = release ]; then NAME="HomeLab-$VER.apk"; else NAME="HomeLab-$VER-debug.apk"; fi
          cp "$SRC" "dist/$NAME"
          ( cd dist && sha256sum "$NAME" > "$NAME.sha256" )
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          ls -l dist

      - uses: actions/upload-artifact@v5
        with:
          name: homelab-panel-apk
          path: dist/*

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: lint-raporu
          path: android-panel/app/build/reports/lint-results-release.html
          if-no-files-found: ignore

      - name: Sürüme ekle (yalnızca kalıcı imzalı APK)
        if: env.SIGNED == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$VER"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "HomeLab $VER" --notes "HomeLab $VER: Linux ajanı (x64, arm64) ve Android paneli."
          fi
          # SHA256SUMS ortaktır: ajan satırları korunur, APK satırı eklenir
          mkdir -p prev
          gh release download "$TAG" -p "SHA256SUMS-$VER.txt" -D prev 2>/dev/null || true
          { [ -f "prev/SHA256SUMS-$VER.txt" ] && grep -v '\.apk' "prev/SHA256SUMS-$VER.txt" || true; cat "dist/$APK_NAME.sha256"; } > "dist/SHA256SUMS-$VER.txt"
          rm -f "dist/$APK_NAME.sha256"
          gh release upload "$TAG" dist/* --clobber
