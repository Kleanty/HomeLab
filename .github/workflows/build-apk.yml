# HomeLab Panel APK'sını GitHub'da derler. Actions sekmesi > "build-apk" > Run workflow.
# Bittiğinde sayfanın altındaki "Artifacts" bölümünden homelab-panel-apk indirilir.
# İsteğe bağlı imza: repo Settings > Secrets'a HOMELAB_KEYSTORE_BASE64, HOMELAB_STORE_PASSWORD,
# HOMELAB_KEY_ALIAS, HOMELAB_KEY_PASSWORD ekle. Eklenmezse APK debug anahtarıyla imzalanır (yine kurulabilir).
name: build-apk

on:
  workflow_dispatch:
  push:
    paths: ["android-panel/**", ".github/workflows/build-apk.yml"]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: İmza anahtarı (varsa)
        env:
          KEYSTORE: ${{ secrets.HOMELAB_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "PHONEBOX_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi
      - name: APK derle
        working-directory: android-panel
        env:
          PHONEBOX_STORE_PASSWORD: ${{ secrets.HOMELAB_STORE_PASSWORD }}
          PHONEBOX_KEY_ALIAS: ${{ secrets.HOMELAB_KEY_ALIAS }}
          PHONEBOX_KEY_PASSWORD: ${{ secrets.HOMELAB_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -x lintVitalRelease --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: homelab-panel-apk
          path: android-panel/app/build/outputs/apk/release/*.apk
